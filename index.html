<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Song Scramble</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="landing">
    <h1 class="display">🎶 Song Scramble</h1>
    <p>A hymn word-order game for two groups. One screen keeps score, each team races on their own phone to tap the
      words back into the right order.</p>

    <div class="role-cards">
      <a class="role-card" href="host.html">
        <span class="icon">📺</span>
        <span class="label">I'm the Display</span>
        <span class="sub">Put this on the shared screen or laptop</span>
      </a>
      <a class="role-card" href="player.html">
        <span class="icon">📱</span>
        <span class="label">I'm a Team</span>
        <span class="sub">One phone per group</span>
      </a>
    </div>
  </div>

</body>

</html>
