<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Bible Buzzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="landing">
    <h1 class="display">✝️ Bible Buzzer</h1>
    <p>A fast-tap Bible trivia game for two players. One screen shows the question, two phones race to answer.</p>

    <div class="role-cards">
      <a class="role-card" href="host.html">
        <span class="icon">📺</span>
        <span class="label">I'm the Display</span>
        <span class="sub">Put this on the shared screen or laptop</span>
      </a>
      <a class="role-card" href="player.html">
        <span class="icon">📱</span>
        <span class="label">I'm a Player</span>
        <span class="sub">Open this on your own phone</span>
      </a>
    </div>
  </div>

</body>

</html>
