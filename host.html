<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Song Scramble — Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="host-wrap">

    <!-- LOBBY -->
    <section id="lobbyView" class="lobby">
      <div class="paper-card torn-edge lobby-card">
        <span class="washi-tape" aria-hidden="true"></span>
        <div class="muted">Teams, scan or type this code to join</div>
        <div class="room-code" id="roomCodeText">----</div>
        <div class="join-info">
          <img id="qrImg" width="170" height="170" alt="QR code to join" />
          <div style="text-align:left">
            <div class="muted" style="font-size:0.9rem;">Join URL</div>
            <div id="joinUrlText" class="accent" style="font-weight:700; word-break: break-all;"></div>
          </div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:10px;">Teams joined</div>
          <ul class="player-list" id="playerList">
            <li class="muted" style="background:transparent;border:none;">Waiting for teams…</li>
          </ul>
        </div>
        <button id="startBtn" class="primary-btn" style="max-width:280px;" disabled>Start Game</button>
      </div>
    </section>

    <!-- PLAYING -->
    <section id="playView" class="hidden" style="display:flex; flex-direction:column; flex:1; gap:22px;">
      <div class="host-topbar">
        <span class="score-pill"><span class="dot"></span><span id="roomCodeSmall">----</span></span>
        <span class="accent" id="questionCounter" style="font-weight:700;">Song 1 / 5</span>
      </div>

      <div class="host-stage">
        <div class="team-boards" id="teamBoards"></div>

        <div id="revealWrap" class="hidden paper-card torn-edge" style="max-width:680px;">
          <div class="muted" id="resultBanner" style="margin-bottom:8px;"></div>
          <div class="reveal-line" id="revealLine"></div>
          <div class="accent" id="revealTitle" style="margin-top:6px; font-weight:700;"></div>
        </div>

        <div class="host-controls">
          <div class="activity-feed" id="activityFeed"></div>
          <button id="skipBtn" class="secondary-btn">Skip to Next Song</button>
        </div>
      </div>
    </section>

    <!-- FINAL -->
    <section id="finalView" class="hidden final">
      <div class="paper-card torn-edge" style="position:relative;">
        <svg class="botanical-accent" aria-hidden="true" width="86" height="78" viewBox="0 0 86 78"
          xmlns="http://www.w3.org/2000/svg" fill="none">
          <path d="M12 74 Q 28 52 22 28 Q 20 14 30 4" stroke="#8a7854" stroke-width="2.5" stroke-linecap="round" />
          <ellipse cx="16" cy="44" rx="8" ry="3.4" fill="#7c8f52" transform="rotate(-32 16 44)" />
          <ellipse cx="26" cy="59" rx="8" ry="3.4" fill="#8a9b5e" transform="rotate(24 26 59)" />
          <ellipse cx="13" cy="63" rx="6.5" ry="2.8" fill="#7c8f52" transform="rotate(-8 13 63)" />
          <circle cx="30" cy="6" r="4" fill="#e6d9b0" />
          <circle cx="37" cy="4" r="4" fill="#ddd0a0" />
          <circle cx="34" cy="11" r="4" fill="#e6d9b0" />
          <circle cx="41" cy="10" r="3.6" fill="#d4c38c" />
          <circle cx="26" cy="12" r="3.6" fill="#ddd0a0" />
          <circle cx="36" cy="16" r="3.2" fill="#c9b573" />
        </svg>
        <div class="muted">Game over</div>
        <div class="winner" id="winnerText">🏆 —</div>
        <div class="final-scores" id="finalScores"></div>
        <button id="playAgainBtn" class="secondary-btn" style="margin-top:6px;">Play Again</button>
      </div>
    </section>

  </div>

  <script src="https://unpkg.com/piesocket-js@5"></script>
  <script src="shared.js"></script>
  <script src="host.js"></script>
</body>

</html>
