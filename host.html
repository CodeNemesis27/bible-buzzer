<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Bible Buzzer — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="host-wrap">

  <!-- LOBBY -->
  <section id="lobbyView" class="lobby">
    <div class="muted">Players, scan or type this code to join</div>
    <div class="room-code" id="roomCodeText">----</div>
    <div class="join-info">
      <img id="qrImg" width="180" height="180" alt="QR code to join" />
      <div style="text-align:left">
        <div class="muted" style="font-size:0.85rem;">Join URL</div>
        <div id="joinUrlText" class="brass" style="font-weight:700; word-break: break-all;"></div>
      </div>
    </div>
    <div>
      <div class="muted" style="margin-bottom:8px;">Players joined</div>
      <ul class="player-list" id="playerList"><li class="muted" style="background:transparent;border:none;">Waiting for players…</li></ul>
    </div>
    <button id="startBtn" class="primary-btn" style="max-width:260px;" disabled>Start Game</button>
  </section>

  <!-- PLAYING -->
  <section id="playView" class="hidden" style="display:flex; flex-direction:column; flex:1; gap:18px;">
    <div class="host-topbar">
      <span class="score-pill"><span class="dot" style="background:var(--brass);"></span><span id="roomCodeSmall">----</span></span>
      <span class="muted" id="questionCounter">Question 1 / 10</span>
      <span id="scoreBoard" style="display:flex; gap:10px;"></span>
    </div>

    <div class="host-stage">
      <div class="question" id="questionText">Get ready…</div>
      <div class="tile-grid" id="tileGrid"></div>
      <div class="host-timer-wrap">
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      </div>
      <div class="activity-feed" id="activityFeed"></div>
    </div>
  </section>

  <!-- FINAL -->
  <section id="finalView" class="hidden final">
    <div class="muted">Game over</div>
    <div class="winner" id="winnerText">🏆 —</div>
    <div class="final-scores" id="finalScores"></div>
    <button id="playAgainBtn" class="secondary-btn">Play Again</button>
  </section>

</div>

<script src="https://unpkg.com/piesocket-js@5"></script>
<script src="shared.js"></script>
<script src="host.js"></script>
</body>
</html>
