<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Bible Buzzer — Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="player-wrap">

    <!-- JOIN -->
    <section id="joinView" class="join-wrap">
      <h1 class="display" style="text-align:center; font-size:1.8rem;">✝️ Join the Game</h1>
      <div class="panel">
        <div class="field">
          <label for="roomInput">Room code</label>
          <input id="roomInput" maxlength="4" placeholder="e.g. SAB7" autocapitalize="characters" />
        </div>
        <div class="field">
          <label for="nameInput">Your name</label>
          <input id="nameInput" maxlength="18" placeholder="e.g. Rica" />
        </div>
        <button id="joinBtn" class="primary-btn">Join Game</button>
        <div id="joinError" class="muted" style="color:var(--bad); margin-top:10px;"></div>
      </div>
    </section>

    <!-- WAITING -->
    <section id="waitingView" class="hidden player-stage" style="text-align:center;">
      <div class="muted">Room <span id="waitingRoom" class="brass"></span></div>
      <h2 class="display">You're in, <span id="waitingName"></span>!</h2>
      <p class="muted">Waiting for the host to start the game…</p>
    </section>

    <!-- QUESTION -->
    <section id="questionView" class="hidden player-stage">
      <div class="player-topbar">
        <span id="questionCounterP">Q 1/10</span>
        <span>Score: <span id="myScore" class="brass">0</span></span>
      </div>
      <div class="player-question" id="questionTextP">—</div>
      <div class="tile-grid" id="tileGridP"></div>
      <div class="player-status" id="statusP">Tap the correct answer!</div>
    </section>

    <!-- FINAL -->
    <section id="finalViewP" class="hidden player-stage" style="text-align:center;">
      <div class="muted">Game over</div>
      <h2 class="display" id="finalResultP">—</h2>
      <div class="muted" id="finalScoreLineP"></div>
    </section>

  </div>

  <script src="https://unpkg.com/piesocket-js@5"></script>
  <script src="shared.js"></script>
  <script src="player.js"></script>
</body>

</html>
