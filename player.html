<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Song Scramble — Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="player-wrap">

    <!-- JOIN -->
    <section id="joinView" class="join-wrap">
      <h1 class="display" style="text-align:center; font-size:1.8rem;">🎶 Join as a Team</h1>
      <div class="panel">
        <div class="field">
          <label for="roomInput">Room code</label>
          <input id="roomInput" maxlength="4" placeholder="e.g. SAB7" autocapitalize="characters" />
        </div>
        <div class="field">
          <label for="nameInput">Team name</label>
          <input id="nameInput" maxlength="20" placeholder="e.g. Team Judah" />
        </div>
        <button id="joinBtn" class="primary-btn">Join Game</button>
        <div id="joinError" class="muted" style="color:var(--bad); margin-top:10px;"></div>
      </div>
    </section>

    <!-- WAITING -->
    <section id="waitingView" class="hidden player-stage" style="text-align:center;">
      <div class="muted">Room <span id="waitingRoom" class="brass"></span></div>
      <h2 class="display">You're in, <span id="waitingName"></span>!</h2>
      <p class="muted">Huddle up — waiting for the host to start the game…</p>
    </section>

    <!-- PLAYING -->
    <section id="questionView" class="hidden player-stage">
      <div class="player-topbar">
        <span id="questionCounterP">Song 1/5</span>
        <span>Score: <span id="myScore" class="brass">0</span></span>
      </div>
      <p class="muted" style="text-align:center; margin:0;">Tap the words in the correct order to rebuild the line.</p>
      <div class="sentence-builder" id="sentenceBuilder"></div>
      <div class="word-pool" id="wordPool"></div>
      <div class="player-status" id="statusP">Go!</div>
    </section>

    <!-- FINAL -->
    <section id="finalViewP" class="hidden player-stage" style="text-align:center;">
      <div class="muted">Game over</div>
      <h2 class="display" id="finalResultP">—</h2>
      <div class="muted" id="finalScoreLineP"></div>
    </section>

  </div>

  <script src="https://unpkg.com/piesocket-js@5"></script>
  <script src="shared.js"></script>
  <script src="player.js"></script>
</body>

</html>
